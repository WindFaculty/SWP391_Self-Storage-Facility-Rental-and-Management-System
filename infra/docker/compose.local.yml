services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: storage_local
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - local-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  local-mysql-data:
