server:
  port: 8088
  servlet:
    context-path: /api/v1

spring:
  application:
    name: storage-management

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=StorageDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

# Security & JWT Configurations
app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-to-a-secure-value}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173

# Springdoc OpenAPI (Swagger UI)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
