name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 25, MySQL Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify
