server:
  servlet:
    context-path: /api/v1
    session:
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: lax

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB
  application:
    name: storage-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/mysql
  jackson:
    default-property-inclusion: non_null

app:
  media:
    storage-dir: ${MEDIA_STORAGE_DIR:./uploads}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/api/v1/media}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  google:
    enabled: ${GOOGLE_LOGIN_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/login/oauth2/code/google}
    frontend-url: ${GOOGLE_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    access-expiration-ms: 1800000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Framework request tracing can include credential DTOs and OAuth protocol values.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
