server:
  servlet:
    context-path: /api/v1
    session:
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: storage-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/mysql
  jackson:
    default-property-inclusion: non_null

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  google:
    enabled: ${GOOGLE_LOGIN_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/login/oauth2/code/google}
    frontend-url: ${GOOGLE_FRONTEND_URL:http://localhost:5173}
  social:
    facebook-app-id: ${FACEBOOK_APP_ID:}
    facebook-app-secret: ${FACEBOOK_APP_SECRET:}
    facebook-api-version: ${FACEBOOK_API_VERSION:v25.0}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    access-expiration-ms: 1800000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Framework request tracing can include credential DTOs and OAuth protocol values.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
